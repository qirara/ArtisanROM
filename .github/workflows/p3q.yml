name: Build p3q

# Galaxy S21 Ultra 5G (Snapdragon) (p3q) flashable zip (One UI 8.5, qssi source) with KernelSU Next kernel.

on:
  workflow_dispatch:
    inputs:
      make_rom_args:
        description: 'Extra make_rom.sh arguments (eg. --debug)'
        type: string
        default: ''
  push:
    branches:
      - 'claude/s21ultra-oneui-port-8zgkkl'
    paths:
      - '.github/scripts/prepare_p3q.sh'
      - '.github/workflows/p3q.yml'
      - 'platform/sm8350/**'
      - 'target/p3q/**'
      - 'unica/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_VERSION: 'r416183b'
  CLANG_URL: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz'
  # Release (user) build by default, pass --debug with workflow_dispatch to get warnings instead of
  # aborts for unsupported SOURCE/TARGET feature combinations
  MAKE_ROM_ARGS: ${{ github.event.inputs.make_rom_args || '' }}

jobs:
  kernel:
    name: Build kernel (KernelSU Next)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            target/p3q/kernel

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            bc bison cpio flex git kmod libelf-dev libssl-dev lz4 make python3 xz-utils

      - name: Restore clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            rm -rf "$RUNNER_TEMP/clang-$CLANG_VERSION" && mkdir -p "$RUNNER_TEMP/clang-$CLANG_VERSION"
            curl -fsSL "$CLANG_URL" | tar -xz -C "$RUNNER_TEMP/clang-$CLANG_VERSION"
            "$RUNNER_TEMP/clang-$CLANG_VERSION/bin/clang" --version

      - name: Build kernel
        run: |
          CLANG_DIR="$RUNNER_TEMP/clang-$CLANG_VERSION" \
            ./target/p3q/kernel/build_kernel.sh "$RUNNER_TEMP/kernel" "$RUNNER_TEMP/kernel-out"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: p3q-kernel
          path: ${{ runner.temp }}/kernel-out
          if-no-files-found: error

  build:
    name: Build ROM
    needs: kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler secilc webp \
            build-essential python-is-python3 python3 wget
          # Not available for every runner kernel, only needed to mount f2fs images
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq linux-modules-extra-$(uname -r) || true
          sudo modprobe erofs f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          source ./buildenv.sh p3q
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_on: any
          command: source ./buildenv.sh p3q && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh p3q
          ./scripts/extract_fw.sh

      - name: Check config and prepare stock-derived files
        run: |
          source ./buildenv.sh p3q
          ./.github/scripts/prepare_p3q.sh "$RUNNER_TEMP/p3q-stock"

      - name: Upload stock firmware report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3q-stock-files
          path: ${{ runner.temp }}/p3q-stock
          if-no-files-found: ignore

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: p3q-kernel
          path: out/kernel/p3q

      - name: Add swapspace
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Build ROM
        run: |
          source ./buildenv.sh p3q
          ./scripts/make_rom.sh $MAKE_ROM_ARGS

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM-p3q
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      # Fails the run when the built ROM can not boot because of its SELinux files
      - name: Check SELinux files
        run: python3 ./.github/scripts/check_selinux.py out/target/p3q/work_dir
